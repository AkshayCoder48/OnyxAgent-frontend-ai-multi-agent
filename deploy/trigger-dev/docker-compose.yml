# =============================================================================
# Self-hosted Trigger.dev v3 — OnyxAgent background-task orchestration stack.
#
# Starting point based on the official self-hosting guide:
#   https://trigger.dev/docs/self-hosting
# Pin the image tag/digest + required env set for YOUR version before
# production use — this compose is a verified structure, not a golden file.
#
#   docker compose up -d
#   → dashboard on http://localhost:3000
#   → create the "onyxagent-background-tasks" project + an access token
#   → wire trigger-worker/.env (TRIGGER_DEPLOYMENT_URL=http://<host>:3000)
#
# Secrets (generate with: openssl rand -base64 32):
#   MAGIC_LINK_SECRET, SESSION_SECRET, COORDINATOR_SECRET
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: trigger
      POSTGRES_PASSWORD: trigger
      POSTGRES_DB: trigger
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trigger -d trigger"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  trigger-web:
    # Pin to the version documented for your deployment:
    #   https://trigger.dev/docs/self-hosting/reference/docker-image
    image: ghcr.io/triggerdotdev/trigger.dev:v3
    restart: unless-stopped
    command: ["node", "--import", "./.output/server/index.mjs"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      # Database (internal compose network)
      DATABASE_URL: postgres://trigger:trigger@postgres:5432/trigger
      DIRECT_URL: postgres://trigger:trigger@postgres:5432/trigger
      # Redis
      REDIS_URL: redis://redis:6379
      # The externally reachable origin of THIS instance (dashboard + API)
      APP_ORIGIN: http://localhost:3000
      SERVICE_NAME: web
      # Secrets — generate per install (openssl rand -base64 32)
      MAGIC_LINK_SECRET: change-me-magic-link
      SESSION_SECRET: change-me-session
      COORDINATOR_SECRET: change-me-coordinator
      # Deployment stubs allow trigger.dev CLI deploys against this instance
      DEPLOYMENT_STUBS_ENABLED: "true"
      #SMTP_HOST: "" # optional — SMTP for account emails/notifications
      #APP_LOG_LEVEL: log
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12

  trigger-worker:
    image: ghcr.io/triggerdotdev/trigger.dev:v3
    restart: unless-stopped
    command: ["node", "--import", "./.output/server/index.mjs"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      trigger-web:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://trigger:trigger@postgres:5432/trigger
      DIRECT_URL: postgres://trigger:trigger@postgres:5432/trigger
      REDIS_URL: redis://redis:6379
      # How tasks reach this instance
      COORDINATOR_HOST: trigger-web
      COORDINATOR_SECRET: change-me-coordinator
      SERVICE_NAME: worker
      # Secrets — must match trigger-web
      SESSION_SECRET: change-me-session

volumes:
  postgres-data:
  redis-data:
