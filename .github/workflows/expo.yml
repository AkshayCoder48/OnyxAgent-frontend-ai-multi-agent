name: OnyxAgent Expo — web + Android + Releases

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: expo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck · tests · web export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install
        working-directory: mobile
        run: npm ci

      - name: Typecheck
        working-directory: mobile
        run: npm run typecheck

      - name: Unit tests
        working-directory: mobile
        run: npm test

      - name: Export static web
        working-directory: mobile
        env:
          EXPO_NO_TELEMETRY: 1
          EXPO_BASE_PATH: /OnyxAgent-frontend-ai-multi-agent
        run: npx expo export --platform web --output-dir dist-web

      - name: SPA fallback for clean URLs
        working-directory: mobile
        run: cp dist-web/index.html dist-web/404.html

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: mobile/dist-web
          if-no-files-found: error

  pages:
    name: Deploy web (GitHub Pages)
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: dist-web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web
      - id: deployment
        uses: actions/deploy-pages@v4

  android:
    name: Signed release APK
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        working-directory: mobile
        run: npm ci

      - name: Prebuild (regenerates android/)
        working-directory: mobile
        env:
          EXPO_NO_TELEMETRY: 1
        run: npx expo prebuild --platform android

      - name: CI keystore (self-signed, installable APK)
        working-directory: mobile
        run: |
          keytool -genkeypair -v -storetype PKCS12 \
            -keystore ci.keystore -storepass onyxagent-ci \
            -alias onyxagent -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=OnyxAgent CI, OU=Mobile, O=OnyxAgent, L=Internet, C=US"

      - name: Assemble signed release
        working-directory: mobile/android
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/mobile/ci.keystore \
            -Pandroid.injected.signing.store.password=onyxagent-ci \
            -Pandroid.injected.signing.key.alias=onyxagent \
            -Pandroid.injected.signing.key.password=onyxagent-ci

      - name: Stage APK
        run: |
          cp mobile/android/app/build/outputs/apk/release/app-release.apk \
             "OnyxAgent-${{ github.ref_name }}-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: OnyxAgent-${{ github.ref_name }}-android.apk
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ci, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out

      - name: Bundle the web build
        run: |
          cd out/web
          zip -qr "$GITHUB_WORKSPACE/onyxagent-web-${{ github.ref_name }}.zip" .
          cp "$GITHUB_WORKSPACE/OnyxAgent-${{ github.ref_name }}-android.apk" . 2>/dev/null || \
            cp out/android-apk/* . 2>/dev/null || true
          cd "$GITHUB_WORKSPACE"
          if [ ! -f "OnyxAgent-${{ github.ref_name }}-android.apk" ]; then
            mv out/android-apk/* "OnyxAgent-${{ github.ref_name }}-android.apk"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          name: OnyxAgent ${{ github.ref_name }} — the glass suite
          generate_release_notes: true
          body: |
            The webapp converted to Expo — all 27 clone screens in orange glass.

            **What's inside**
            - ${{ github.ref_name }} · OnyxAgent mobile, the complete glass UI from the clone file (S1–S27) plus the Store-card and Terraces scenes
            - Live skin system — five presets + a custom hue picker, persisted (`oa.brand`)
            - Butter: spring presses, staggered blur-in entrances, breathing orbs, real backdrop blur on device

            **Assets**
            - `OnyxAgent-${{ github.ref_name }}-android.apk` — signed, installable (CI self-signed key)
            - `onyxagent-web-${{ github.ref_name }}.zip` — static web build (preconfigured for GitHub Pages)
            - Web deployment: https://akshaycoder48.github.io/OnyxAgent-frontend-ai-multi-agent/

            Install: enable *Install unknown apps* for your browser/file manager, then open the APK.
          files: |
            OnyxAgent-${{ github.ref_name }}-android.apk
            onyxagent-web-${{ github.ref_name }}.zip
